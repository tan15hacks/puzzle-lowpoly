<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8fd3ff" />
    <meta
      name="description"
      content="Gravity Grid — a mobile-first low-poly puzzle game built with Three.js."
    />
    <title>Gravity Grid</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Gravity Grid game"></canvas>

      <section class="hud" aria-live="polite">
        <div class="brand">
          <span class="brand__eyebrow">LOW-POLY PUZZLE</span>
          <strong>GRAVITY GRID</strong>
        </div>

        <div class="stats">
          <div class="stat">
            <span>ENERGY</span>
            <strong id="crystal-count">0 / 3</strong>
          </div>
          <div class="stat">
            <span>MOVES</span>
            <strong id="move-count">0</strong>
          </div>
        </div>
      </section>

      <section class="hint" id="hint">
        Collect every energy crystal, then enter the portal.
      </section>

      <section class="controls" aria-label="Game controls">
        <div class="rotate-controls">
          <button type="button" data-action="rotate-left" aria-label="Rotate stage left">↶</button>
          <span>ROTATE</span>
          <button type="button" data-action="rotate-right" aria-label="Rotate stage right">↷</button>
        </div>

        <div class="dpad">
          <button type="button" class="dpad__up" data-action="up" aria-label="Move up">▲</button>
          <button type="button" class="dpad__left" data-action="left" aria-label="Move left">◀</button>
          <button type="button" class="dpad__down" data-action="down" aria-label="Move down">▼</button>
          <button type="button" class="dpad__right" data-action="right" aria-label="Move right">▶</button>
        </div>

        <button type="button" class="reset-button" data-action="reset" aria-label="Restart level">RESTART</button>
      </section>

      <section class="result-panel" id="result-panel" hidden>
        <div class="result-card">
          <span class="result-card__eyebrow">LEVEL COMPLETE</span>
          <h1>Grid restored!</h1>
          <p id="result-summary">You reached the portal.</p>
          <button type="button" data-action="reset">PLAY AGAIN</button>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
